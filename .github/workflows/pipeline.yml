name: Pipeline

# Esteira da função serverless:
#   PR            -> lint + testes + build + terraform plan
#   merge na main -> lint + testes + build + terraform apply (deploy contínuo)
#   botão Actions -> plan | apply | destroy sob demanda
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # OIDC: o job troca este token por credenciais AWS temporárias
  contents: read

concurrency:
  group: pipeline-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::538880133939:role/gha-tc-lambda-auth

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build dos bundles
        run: npm run build

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
        run: |
          terraform -chdir=terraform plan -no-color -input=false | tee plan.txt
          {
            echo '## Terraform plan'
            echo '```'
            tail -n 80 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform -chdir=terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform -chdir=terraform destroy -auto-approve -input=false
